# Compatibilité avec les anciennes commandes à deux fichiers Compose.
# compose.yaml inclut désormais toutes les variables bancaires du .env.
services:
  budgetward:
    environment:
      BUDGETWARD_BANK_LOGIN: ${BUDGETWARD_BANK_LOGIN:-}
      BUDGETWARD_BANK_PASSWORD: ${BUDGETWARD_BANK_PASSWORD:-}
