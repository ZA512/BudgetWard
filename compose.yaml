services:
  budgetward:
    image: ${BUDGETWARD_IMAGE:-ghcr.io/za512/budgetward:latest}
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8010}:8000"
    environment:
      BUDGETWARD_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      BUDGETWARD_DB_PATH: /data/app.db
      BUDGETWARD_SECURE_COOKIE: ${BUDGETWARD_SECURE_COOKIE:-false}
      BUDGETWARD_BANK_WEBSITE: ${BUDGETWARD_BANK_WEBSITE:-}
      TZ: Europe/Paris
    secrets:
      - admin_token
    volumes:
      - "${APPDATA_PATH:-./data}:/data"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 20s

secrets:
  admin_token:
    file: ${ADMIN_TOKEN_FILE:-./secrets/admin_token}
